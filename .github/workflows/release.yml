# Tag push (vX.Y.Z) → tests → GitHub Release with the CHANGELOG section as notes.
# Any failure → a card in a Notion issue database (skipped when NOTION_API_KEY is not set).
# Manual run (Actions tab → Run workflow): tests only, no release; tick simulate_failure to try the Notion path.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Fail on purpose after the tests (checks the Notion card path)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-latest  # pwiki runs on /usr/bin/python3 (standard library only), as on users' Macs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run tests
        run: /usr/bin/python3 -m unittest discover -s tests
      - name: Simulated failure
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "simulate_failure was set on a manual run" >&2
          exit 1

  release:
    needs: test
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check tag against VERSION and extract notes
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/ci_release.py notes "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "pwiki ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"

  notify-failure:
    needs: [test, release]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
    steps:
      - name: Check Notion secrets
        id: secrets
        run: |
          if [ -n "$NOTION_API_KEY" ] && [ -n "$NOTION_DATABASE_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::NOTION_API_KEY or NOTION_DATABASE_ID is not set; no Notion card"
          fi
      - uses: actions/checkout@v4
        if: ${{ steps.secrets.outputs.ok == 'true' }}
        with:
          persist-credentials: false
      - name: Collect failed jobs, steps and log tails
        if: ${{ steps.secrets.outputs.ok == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/summary.txt"
          : > "$out"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | [.id, .name, ([.steps[] | select(.conclusion == "failure") | .name] | join(", "))] | @tsv' |
          while IFS=$'\t' read -r id name steps; do
            printf '== job %s · failed step: %s\n' "$name" "${steps:-?}" >> "$out"
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" 2>/dev/null |
              sed -E 's/^[0-9T:.-]+Z //' | grep -v '^##\[' | tail -n 40 >> "$out" || true
            echo >> "$out"
          done || echo "(could not list failed jobs)" >> "$out"
          cat "$out"
      - name: Create Notion issue card
        if: ${{ steps.secrets.outputs.ok == 'true' }}
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          COMMIT_MSG="$(git log -1 --format=%B "$GITHUB_SHA")" SUMMARY_FILE="$RUNNER_TEMP/summary.txt" \
            python3 tools/ci_release.py notion-payload > "$RUNNER_TEMP/payload.json"
          # Notion-Version 2022-06-28 still accepts a database_id parent; newer versions want a data_source_id.
          curl -sS --fail-with-body -X POST https://api.notion.com/v1/pages \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/payload.json" -o "$RUNNER_TEMP/notion.json"
          echo "Notion page: $(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("url",""))' "$RUNNER_TEMP/notion.json")"
